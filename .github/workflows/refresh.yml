name: Refresh feeds

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may start scheduled runs a few minutes late
  workflow_dispatch:
    inputs:
      all_tiers:
        description: "Refresh every tier now (not just Orange & OC)"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds and build the site
        run: python server.py --build site ${{ (github.event_name == 'workflow_dispatch' && inputs.all_tiers) && '--force' || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
